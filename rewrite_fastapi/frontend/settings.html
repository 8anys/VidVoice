<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VidVoice — Settings</title>
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body>
    <div class="simple-shell">
      <a class="back-link" href="/">← Back</a>
      <div class="page-title">
        <div class="eyebrow">App</div>
        <h1>Settings</h1>
      </div>

      <div class="page-card">
        <div class="content-card" style="margin-bottom:1rem;">
          <div class="heading" style="margin-bottom:1rem;">Default Language</div>
          <div class="field-row">
            <select id="language-select" class="select">
              <option value="en">English</option>
              <option value="uk">Українська</option>
              <option value="ru">Русский</option>
            </select>
            <label class="muted"><input id="auto-translate" type="checkbox" /> Auto-translate</label>
          </div>
        </div>

        <div class="content-card" style="margin-bottom:1rem;">
          <div class="heading" style="margin-bottom:1rem;">Preferred Voice</div>
          <div class="field-row">
            <select id="voice-select" class="select">
              <option value="rachel">Rachel — Calm & Clear</option>
              <option value="clyde">Clyde — Strong & Warm</option>
              <option value="bella">Bella — Soft & Natural</option>
              <option value="josh">Josh — Deep & Steady</option>
            </select>
            <select id="quality-select" class="select">
              <option value="high">High (slower)</option>
              <option value="medium">Medium</option>
              <option value="low">Low (fastest)</option>
            </select>
          </div>
        </div>

        <div class="content-card">
          <div class="heading" style="margin-bottom:1rem;">Video & Export</div>
          <div class="field-row">
            <select id="format-select" class="select">
              <option value="mp4">MP4 (H.264)</option>
              <option value="webm">WebM (VP9)</option>
              <option value="mov">MOV (ProRes)</option>
            </select>
            <label class="muted"><input id="auto-save" type="checkbox" /> Auto-save</label>
          </div>
        </div>

        <div class="toolbar" style="margin-top:1.5rem;justify-content:flex-end;">
          <button class="outline-button" type="button">Reset</button>
          <button id="save-settings" class="button" type="button">Save</button>
        </div>
      </div>
    </div>
    <script type="module" src="/assets/js/settings.js"></script>
  </body>
</html>
