<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VidVoice - Profile</title>
    <link rel="stylesheet" href="/assets/css/styles.css?v=projects-crud-3" />
  </head>
  <body>
    <div class="simple-shell">
      <div class="simple-topbar">
        <a class="back-link" href="/" data-i18n="common.back">← Back</a>
        <div class="simple-actions">
          <button id="site-language-toggle" class="outline-button nav-language-toggle" type="button" data-language-toggle-label>UA</button>
          <button id="site-theme-toggle" class="nav-theme-toggle" type="button" data-theme-toggle aria-label="Toggle theme" title="Toggle theme">
            <span class="theme-icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <div class="page-card">
        <div class="toolbar" style="align-items:flex-start;">
          <div class="inline-row">
            <div class="profile-avatar-large" id="profile-avatar-large">IV</div>
            <div>
              <h1 id="profile-name" class="heading" style="margin:0 0 0.5rem;">User</h1>
              <div id="profile-email" class="muted"></div>
              <div class="muted"><span data-i18n="profile.memberSince">Member since</span> <span id="member-since">-</span></div>
            </div>
          </div>
          <button id="logout-profile" class="outline-button" type="button" data-i18n="common.logout">Log out</button>
        </div>

        <div class="content-card" style="margin-top:1.5rem;">
          <div class="field-row">
            <input id="name-input" class="input" placeholder="Name" data-i18n-placeholder="profile.name" />
            <button id="save-profile" class="button" type="button" data-i18n="common.save">Save</button>
          </div>
        </div>

        <div class="stats-grid" style="margin-top:1.5rem;">
          <div class="stat-card page-card"><div id="profile-projects-count">0</div><div class="muted" data-i18n="profile.projects">Projects</div></div>
          <div class="stat-card page-card"><div id="profile-audio-count">0</div><div class="muted" data-i18n="profile.audioGenerated">Audio Generated</div></div>
          <div class="stat-card page-card"><div id="profile-video-count">0</div><div class="muted" data-i18n="profile.videosGenerated">Videos Generated</div></div>
          <div class="stat-card page-card"><div id="profile-credits-used">0</div><div class="muted" data-i18n="profile.creditsUsed">Credits Used</div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/assets/js/profile.js?v=projects-crud-3"></script>
  </body>
</html>
