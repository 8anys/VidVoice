<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VidVoice — Credits</title>
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body>
    <div class="simple-shell">
      <a class="back-link" href="/">← Back</a>
      <div class="page-title">
        <div class="eyebrow">ElevenLabs</div>
        <h1>Credits & Usage</h1>
      </div>

      <div class="page-card" style="margin-bottom:1.5rem;">
        <div class="toolbar" style="margin-bottom:1.25rem;">
          <div class="inline-row">
            <div class="icon-box" style="width:2.5rem;height:2.5rem;">⚡</div>
            <div>
              <div class="heading">Character Credits</div>
              <div class="muted">ElevenLabs Text-to-Speech</div>
            </div>
          </div>
          <div style="text-align:right;">
            <div id="credits-pct" class="heading" style="font-size:1.8rem;">0%</div>
            <div class="muted">Usage</div>
          </div>
        </div>
        <div class="progress-bar" style="height:0.75rem;margin-bottom:1rem;"><div id="credits-fill" style="width:0%"></div></div>
        <div class="stats-grid" style="grid-template-columns:repeat(3,minmax(0,1fr));">
          <div class="stat-card content-card"><div id="credits-used" class="heading">0</div><div class="muted">Characters Used</div></div>
          <div class="stat-card content-card"><div id="credits-left" class="heading">0</div><div class="muted">Remaining</div></div>
          <div class="stat-card content-card"><div id="credits-total" class="heading">0</div><div class="muted">Total Limit</div></div>
        </div>
      </div>

      <div class="page-card">
        <div class="heading" style="margin-bottom:1rem;">Usage History</div>
        <div id="credits-history" class="inline-row" style="align-items:flex-end;gap:1rem;min-height:14rem;"></div>
      </div>
    </div>
    <script type="module" src="/assets/js/credits.js"></script>
  </body>
</html>
